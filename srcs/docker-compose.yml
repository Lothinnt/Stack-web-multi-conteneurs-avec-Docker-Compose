networks:
  inception_network:
    driver: bridge

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb

services:

  mariadb:
    build: ./requirements/mariadb/.
    container_name: mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - inception_network
    env_file: .env
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_ADMIN_USER=${MARIADB_ADMIN_USER}
      - MARIADB_ADMIN_USER_PASSWORD=${MARIADB_ADMIN_USER_PASSWORD}
      - MARIADB_SECOND_USER=${MARIADB_SECOND_USER}
      - MARIADB_SECOND_USER_PASSWORD=${MARIADB_SECOND_USER_PASSWORD}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}

  wordpress:
    build: ./requirements/wordpress/.
    container_name: wordpress
    volumes:
      - wordpress_data:/var/www/wordpress
    restart: unless-stopped
    networks:
      - inception_network
    env_file: .env
    environment:
      - DB_NAME=${MARIADB_DATABASE}
      - DB_USER=${MARIADB_ADMIN_USER}
      - DB_PASSWORD=${MARIADB_ADMIN_USER_PASSWORD}
      - DB_HOST=${DB_HOST}
      - WP_URL=${WP_URL}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_PASSWORD=${WP_USER_PASSWORD}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    depends_on:
      - mariadb
    expose:
      - "9000"

  nginx:
    build: ./requirements/nginx/.
    container_name: nginx
    volumes:
      - wordpress_data:/var/www/wordpress
    networks:
      - inception_network
    ports:
      - "443:443"
    restart: unless-stopped
    depends_on:
      - wordpress
